,"한국광복군 창설"],people:["김구","유관순","윤봉길","신채호"],assets:["한글 맞춤법 통일안(1933)","독립신문"],timeline:[["1910년","국권 피탈"],["1919년","3·1 운동, 대한민국 임시정부 수립"],["1920년","봉오동·청산리 전투"],["1927년","신간회 결성"],["1940년","한국광복군 창설"]]},{id:"modern",name:"대한민국 현대사",span:"1945년~현재",summary:"정부 수립 이후 전쟁, 산업화, 민주화를 거쳐 오늘에 이르렀습니다.",concepts:["광복과 정부 수립","6·25 전쟁과 분단 고착","4·19 혁명에서 6월 민주 항쟁까지 민주화 운동","경제 성장과 외환 위기"],events:["대한민국 정부 수립","6·25 전쟁","4·19 혁명","5·16 군사 정변","5·18 민주화 운동","6월 민주 항쟁"],people:["이승만","박정희","김대중"],assets:["5·18 민주화운동 기록물"],timeline:[["1948년","대한민국 정부 수립"],["1950년","6·25 전쟁"],["1960년","4·19 혁명"],["1980년","5·18 민주화 운동"],["1987년","6월 민주 항쟁"]]}];var D1={};var $g="공부돼지 「벼락치기 한능검 2026 요약노트(개정)」 기반 자체 출제 (이용 조건은 원저작자 확인 필요)",Wg=[["선사 시대","문화재 문제","청동기 시대의 유물로 옳은 것은?",["가락바퀴","비파형 동검","주먹도끼","빗살무늬 토기","명도전"],1,"청동기 시대에는 비파형 동검, 반달 돌칼, 고인돌이 대표적입니다. 주먹도끼는 구석기, 빗살무늬 토기와 가락바퀴는 신석기 유물입니다.",["청동기","비파형 동검"]],["고조선","사건 문제","고조선에 대한 설명으로 옳은 것은?",["민며느리제 풍습이 있었다","제가 회의에서 국가 중대사를 논의했다","범금 8조를 시행했다","5부 연맹체로 사출도가 있었다","천군이 소도에서 제사를 주관했다"],2,"고조선은 범금 8조를 시행했고, 위만 조선은 우거왕 때 한 무제의 침략으로 멸망했습니다. 사출도는 부여, 소도는 삼한, 제가 회의는 고구려와 관련됩니다.",["범금 8조","위만","왕검성"]],["여러 나라의 성장","사회사","5부 연맹체로 왕 아래 사출도가 있었고, 12월에 영고를 연 나라는?",["부여","옥저","동예","삼한","고구려"],0,"부여는 사출도와 영고(12월)가 특징입니다. 고구려는 동맹(10월), 동예는 무천(10월)을 열었습니다.",["부여","영고"]],["여러 나라의 성장","사회사","제천 행사로 무천을 열고 책화라는 풍습이 있던 나라는?",["삼한","부여","옥저","동예","고구려"],3,"동예는 무천(10월)과 책화가 특징이며 단궁·과하마·반어피가 특산물입니다. 옥저는 민며느리제와 골장제로 유명합니다.",["동예","무천","책화"]],["삼국 시대","인물 문제","율령을 반포하고 태학을 설립했으며 불교를 수용한 고구려의 왕은?",["고국원왕","광개토왕","고국천왕","소수림왕","장수왕"],3,"소수림왕의 업적입니다. 고국원왕은 백제의 침입으로 평양성에서 전사했습니다.",["소수림왕","율령","태학"]],["삼국 시대","인물 문제","영락 연호를 사용하고 신라를 공격한 왜군을 격퇴한 고구려의 왕은?",["동천왕","장수왕","고국양왕","광개토왕","미천왕"],3,"광개토왕은 만주를 정복하고 왜군을 격퇴했습니다. 장수왕은 평양 천도 후 백제 개로왕을 죽이고 한강 유역을 차지했습니다.",["광개토","영락"]],["삼국 시대","연표 문제","고구려와 중국 왕조의 전쟁을 일어난 순서대로 바르게 나열한 것은?",["살수대첩 → 연개소문 정변 → 안시성 전투","안시성 전투 → 연개소문 정변 → 살수대첩","안시성 전투 → 살수대첩 → 연개소문 정변","살수대첩 → 안시성 전투 → 연개소문 정변","연개소문 정변 → 살수대첩 → 안시성 전투"],0,"수나라와의 살수대첩 이후 당에서 연개소문 정변이 일어났고, 당나라와의 전쟁에서 안시성 전투가 벌어졌습니다.",["살수 대첩","안시성","연개소문"]],["삼국 시대","인물 문제","지방에 22담로를 두어 왕족을 파견한 백제의 왕은?",["의자왕","침류왕","무령왕","근초고왕","성왕"],2,"무령왕은 중국 남조(양)와 외교하고 벽돌무덤에 묻혔습니다. 성왕은 사비 천도와 국호 남부여로 유명합니다.",["무령왕","22담로"]],["삼국 시대","정치사","이차돈의 순교로 불교를 공인하고 건원 연호를 사용한 신라의 왕은?",["선덕여왕","내물마립간","진흥왕","지증왕","법흥왕"],4,"법흥왕은 병부와 상대등을 설치하고 금관가야를 복속했습니다. 지증왕은 국호를 신라로 하고 동시전을 설치했습니다.",["법흥왕","이차돈"]],["삼국 시대","사건 문제","신라와 당이 싸운 나당 전쟁의 전투로 옳은 것은?",["대야성 전투","관산성 전투","황산벌 전투","안시성 전투","매소성·기벌포 전투"],4,"당이 안동도호부 등을 설치하자 나당 전쟁이 벌어졌고 매소성·기벌포 전투 후 삼국이 통일되었습니다. 황산벌 전투는 계백의 백제군과의 전투입니다.",["나당 전쟁","매소성","기벌포"]],["남북국 시대","정치사","관료전을 지급하고 녹읍을 폐지한 통일 신라의 왕은?",["신문왕","경덕왕","문무왕","원성왕","진성여왕"],0,"신문왕은 김흠돌 모역사건 후 귀족 세력을 숙청하고 9주 5소경, 9서당 10정을 정비했습니다. 원성왕은 독서삼품과를 시행했습니다.",["신문왕","관료전","녹읍"]],["남북국 시대","인물 문제","「격황소서」를 짓고 시무책 10여 조를 건의한 6두품은?",["설총","원효","원광","최치원","강수"],3,"최치원은 진성여왕에게 시무책을 건의했습니다. 설총은 「화왕계」를 지었고, 원효는 불교 대중화에 힘쓴 승려입니다.",["최치원","격황소서"]],["남북국 시대","문화재 문제","불국사 석가탑에서 발견된 목판 인쇄물은?",["초조대장경","상정고금예문","무구정광대다라니경","직지심체요절","팔만대장경"],2,"무구정광대다라니경은 석가탑에서 발견된 목판 인쇄물입니다. 직지심체요절은 고려 청주 흥덕사의 금속활자본입니다.",["무구정광대다라니경","석가탑"]],["남북국 시대","사건 문제","후삼국 시대에 견훤이 승리한 전투는?",["황산벌 전투","일리천 전투","고창 전투","진포대첩","공산 전투"],4,"견훤은 신라 경애왕을 습격한 뒤 공산 전투에서 승리했습니다. 고창·일리천 전투는 왕건이 승리했습니다.",["견훤","공산 전투"]],["고려","인물 문제","쌍기의 건의로 과거제를 실시하고 노비안검법을 시행한 왕은?",["태조","성종","경종","광종","혜종"],3,"광종은 과거제와 노비안검법을 시행하고 광덕·준풍 연호를 썼습니다. 경종은 전시과를 시행했습니다.",["광종","노비안검법","과거제"]],["고려","정치사","성종 때의 일로 옳은 것은?",["노비안검법 실시","전시과 시행","12목 설치와 국자감 설치","역분전 지급","훈요 10조 남김"],2,"성종은 최승로의 시무 28조를 받아들여 12목과 국자감을 설치했습니다. 전시과는 경종, 역분전과 훈요 10조는 태조 때입니다.",["성종","시무 28조","12목"]],["고려","지역 문제","거란의 1차 침입 때 서희가 담판으로 확보한 지역은?",["철령","동북 9성","쌍성총관부","동녕부","강동 6주"],4,"서희는 강동 6주를 얻었습니다. 동북 9성은 예종 때 윤관이 쌓았다가 여진에 반환했습니다.",["서희","강동 6주"]],["고려","사건 문제","서경 천도, 칭제건원, 금국정벌을 주장했고 김부식이 진압한 난은?",["만적의 난","묘청의 난","이자겸의 난","망이·망소이의 난","조위총의 난"],1,"인종 때의 묘청의 난입니다. 이자겸과 척준경의 반란은 별개의 사건입니다.",["묘청의 난","김부식"]],["고려","정치사","최충헌이 설치한 무신 정권의 권력 기구는?",["중방","정방","도병마사","교정도감","중추원"],3,"최충헌은 봉사 10조를 올리고 교정도감을 설치했습니다. 정방은 최우가 설치했습니다.",["최충헌","교정도감"]],["고려","정치사","공민왕의 개혁으로 옳은 것은?",["정방 설치, 강화도 천도","과전법 제정","별무반 편성, 동북 9성 축조","정동행성 폐지, 쌍성총관부 탈환","교정도감 설치"],3,"공민왕은 기철 등 권문세족을 숙청하고 정동행성을 폐지했으며 신돈을 통해 전민변정도감을 설치했습니다.",["공민왕","정동행성"]],["고려","연표 문제","조선 건국 과정을 순서대로 나열한 것은?",["과전법 → 요동 정벌 추진 → 위화도 회군 → 조선 건국","요동 정벌 추진 → 위화도 회군 → 과전법 → 조선 건국","위화도 회군 → 요동 정벌 추진 → 과전법 → 조선 건국","요동 정벌 추진 → 과전법 → 위화도 회군 → 조선 건국","요동 정벌 추진 → 위화도 회군 → 조선 건국 → 과전법"],1,"명의 철령위 설치 요구 후 최영이 요동 정벌을 추진했고, 이성계의 위화도 회군 뒤 과전법을 거쳐 조선이 건국되었습니다.",["위화도 회군","과전법"]],["고려","문화사","정혜쌍수와 돈오점수를 주장하고 수선사 결사를 조직한 승려는?",["지눌","요세","균여","의천","혜심"],0,"지눌은 조계종을 개창했습니다. 의천은 천태종을 개창하고 교관겸수를 제시했습니다.",["지눌","조계종"]],["조선 전기","정치사","세조 때의 일로 옳은 것은?",["직전법 실시","계해약조 체결","홍문관 설치","경국대전 완성","현량과 실시"],0,"세조는 계유정난으로 즉위해 직전법을 실시했습니다. 경국대전과 홍문관은 성종, 계해약조는 세종 때입니다.",["세조","직전법"]],["조선 전기","사건 문제","조광조 일파가 제거된 사화는?",["무오사화","기묘사화","기사환국","을사사화","갑자사화"],1,"중종 때 조광조가 현량과와 위훈 삭제를 주장하다 기묘사화로 제거되었습니다. 무오사화는 조의제문, 갑자사화는 폐비 윤씨 사건이 계기입니다.",["조광조","기묘사화"]],["조선 후기","경제사","균역법에 대한 설명으로 옳은 것은?",["전세 부담액을 고정했다","공인이 등장하는 계기가 되었다","방납의 폐단 해결을 위해 쌀이나 돈으로 납부하게 했다","군역을 2필에서 1필로 줄이고 부족분은 결작 등으로 보충했다","양반에게도 군포를 징수했다"],3,"균역법은 영조 때 실시되었습니다. 방납 해결과 공인 등장은 대동법(광해군), 전세 고정은 영정법(인조)입니다.",["균역법","영조"]],["조선 후기","정치사","신해통공으로 금난전권을 폐지하고 초계문신제와 장용영을 시행한 왕은?",["정조","경종","순조","영조","숙종"],0,"정조의 정책입니다. 영조는 탕평비를 세우고 균역법을 실시했습니다.",["정조","신해통공","규장각"]],["조선 후기","인물 문제","병자호란 때 주화론을 주장한 인물은?",["홍익한","최명길","송시열","김상헌","이원익"],1,"최명길은 주화론, 김상헌은 척화주전론을 주장했습니다. 송시열은 효종 때 북벌론과 관련됩니다.",["병자호란","최명길"]],["조선 후기","문화재 문제","정선의 작품으로 옳은 것은?",["씨름도","고사관수도","인왕제색도","세한도","몽유도원도"],2,"정선은 금강전도와 인왕제색도를 그렸습니다. 고사관수도는 강희안, 몽유도원도는 안견, 세한도는 김정희의 작품입니다.",["정선","인왕제색도"]],["개항기","사건 문제","양헌수가 정족산성에서 프랑스군을 물리친 사건은?",["병인양요","신미양요","제너럴 셔먼호 사건","임오군란","운요호 사건"],0,"병인양요(1866)입니다. 신미양요(1871)에서는 어재연이 광성보에서 싸웠습니다.",["병인양요","양헌수"]],["개항기","사료 문제","강화도 조약(1876)에서 인정한 내용으로 옳은 것은?",["최혜국 대우 규정","일본의 조선 해안 측량권","관세 자주권","청 상인의 내지 통상권","천주교 포교"],1,"운요호 사건을
